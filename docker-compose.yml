services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: causalbound
      POSTGRES_PASSWORD: causalbound_local_dev
      POSTGRES_DB: policy_ledger
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U causalbound -d policy_ledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql://causalbound:causalbound_local_dev@postgres:5432/policy_ledger
      CAUSALBOUND_FAST_MODEL: ${CAUSALBOUND_FAST_MODEL:-gemini-3.8-flash}
      CAUSALBOUND_PRO_MODEL: ${CAUSALBOUND_PRO_MODEL:-gemini-3.1-pro}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pg_data:
